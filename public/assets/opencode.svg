<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Black background -->
  <rect width="100" height="100" rx="22" fill="#000000"/>

  <!-- Outer white rounded rect frame (stroke only) -->
  <rect
    x="18" y="18" width="64" height="64"
    rx="14"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5"
  />

  <!-- Inner white filled rounded rect -->
  <rect
    x="33" y="33" width="34" height="34"
    rx="8"
    fill="#FFFFFF"
  />
</svg>
